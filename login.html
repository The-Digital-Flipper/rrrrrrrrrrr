<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In – AI Switchboard</title>
  <style>
    :root{--bg:#050A14;--panel:#070C16;--text:#fff;--muted:#94a3b8;--line:rgba(255,255,255,.10);--blue:#2563eb}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,rgba(37,99,235,.18),transparent 45%),radial-gradient(circle at 70% 80%,rgba(124,58,237,.15),transparent 45%);pointer-events:none}
    a{text-decoration:none;color:inherit}
    .card{position:relative;z-index:1;width:100%;max-width:420px;margin:24px;border:1px solid var(--line);background:rgba(7,12,22,.85);border-radius:28px;padding:48px 40px;box-shadow:0 40px 120px rgba(0,0,0,.5);backdrop-filter:blur(24px);text-align:center}
    .logo{position:relative;width:64px;height:64px;display:grid;place-items:center;margin:0 auto 24px}
    .logo:before{content:"";position:absolute;inset:0;border-radius:22px;background:linear-gradient(135deg,#1A66FF,#14C8FF,#6B4DFF);box-shadow:0 0 38px rgba(37,99,235,.45)}
    .logo:after{content:"";position:absolute;inset:1.5px;border-radius:20px;background:rgba(6,16,32,.94)}
    .logo svg{position:relative;z-index:1;width:40px;height:40px;filter:drop-shadow(0 0 14px rgba(0,229,255,.8))}
    h1{margin:0 0 8px;font-size:26px;font-weight:950;letter-spacing:-.04em}
    .sub{color:var(--muted);font-size:15px;margin:0 0 36px;line-height:1.6}
    .divider{display:flex;align-items:center;gap:16px;margin:28px 0;color:#334155;font-size:12px;font-weight:800}
    .divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
    .g-btn-wrap{display:flex;justify-content:center}
    .error{display:none;margin-top:20px;padding:14px 18px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);border-radius:14px;color:#fca5a5;font-size:13px}
    .back{display:inline-flex;align-items:center;gap:7px;margin-top:28px;color:#475569;font-size:13px;font-weight:700;transition:.15s}
    .back:hover{color:#94a3b8}
    .setup-note{display:none;margin-top:28px;padding:16px 18px;background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.22);border-radius:14px;color:#fde68a;font-size:13px;line-height:1.6;text-align:left}
    .setup-note code{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:6px;font-size:12px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 64 64"><path d="M17 20 32 12l15 8M17 32h30M17 44 32 52l15-8" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round"/><defs><linearGradient id="lg" x1="8" y1="8" x2="56" y2="56"><stop stop-color="#BFEAFF"/><stop offset=".45" stop-color="#1E8CFF"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient></defs><circle cx="17" cy="20" r="5" fill="#fff"/><circle cx="47" cy="20" r="5" fill="#4DA3FF"/><circle cx="17" cy="32" r="5" fill="#1E8CFF"/><circle cx="47" cy="32" r="5" fill="#00E5FF"/><circle cx="17" cy="44" r="5" fill="#6B4DFF"/><circle cx="47" cy="44" r="5" fill="#A78BFA"/></svg>
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your AI Switchboard account</p>

    <!-- Replace YOUR_GOOGLE_CLIENT_ID with your actual Client ID from Google Cloud Console -->
    <!-- See README.md for setup instructions -->
    <div id="g_id_onload"
         data-client_id="187432891940-rouq4pmbbnuaqf9r7m50aildg3vedj4o.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    <div class="divider">Sign in with</div>
    <div class="g-btn-wrap">
      <div class="g_id_signin"
           data-type="standard"
           data-shape="pill"
           data-theme="filled_black"
           data-text="signin_with"
           data-size="large"
           data-logo_alignment="left"
           data-width="320">
      </div>
    </div>

    <div class="error" id="error">
      Unable to complete sign-in. Please try again.
    </div>

    <div class="setup-note" id="setup-note">
      ⚠️ <strong>Setup required:</strong> Replace <code>YOUR_GOOGLE_CLIENT_ID</code> in <code>login.html</code> with your real Google Client ID. See <strong>README.md</strong> for step-by-step instructions.
    </div>

    <a class="back" href="/">← Back to home</a>
  </div>

  <script>
    // Show setup warning if the placeholder client ID hasn't been replaced
    if (document.getElementById('g_id_onload').dataset.client_id === 'YOUR_GOOGLE_CLIENT_ID') {
      document.getElementById('setup-note').style.display = 'block';
    }

    function handleCredentialResponse(response) {
      try {
        // Decode the JWT payload (display info only — signature is verified by Google's library)
        const base64 = response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const payload = JSON.parse(atob(base64));
        localStorage.setItem('aisb_user', JSON.stringify({
          name: payload.name || '',
          email: payload.email || '',
          picture: payload.picture || '',
          sub: payload.sub || ''
        }));
        window.location.href = '/';
      } catch (e) {
        document.getElementById('error').style.display = 'block';
      }
    }
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
